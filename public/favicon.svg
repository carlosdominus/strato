  <path class="leaf" d="M 50 26 C 60 18 72 20 80 24 C 72 26 60 26 50 28 Z" />
  <path class="leaf" d="M 50 26 C 45 15 35 14 30 15 C 36 19 44 22 50 28 Z" />
  <path class="leaf" d="M 50 26 C 55 15 65 14 70 15 C 64 19 56 22 50 28 Z" />
</svg>
